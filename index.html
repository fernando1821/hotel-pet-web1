<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
       
        <section class="imagem-login">
            
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPjTROxBHu58m-F3plhKqP2oCn042RCWtMnq-n-W0cnw&s=10" alt="Imagem de boas-vindas do Hotel Pet">
        </section>

        
        <section class="area-formulario">
            <h1>Hotel Pet</h1>
            
            <form action="reservas.html" method="POST">
               
                <div>
                    <label for="login" style="display: none;">Login</label>
                    <input type="text" id="login" name="login" placeholder="Login" required>
                </div>
                
             
                <div>
                    <label for="senha" style="display: none;">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                  
                </div>
                
               
                <div class="opcoes-extras">
                    <label>
                        <input type="checkbox" name="lembrar" id="lembrar">
                        matenha-me conectado
                    </label>
                    <a href="#">Esqueci a senha</a>
                </div>
                
              
                <button type="submit">Enviar</button>
            </form>

           
            <div class="separador">
                <hr>
                <span>ou</span>
                <hr>
            </div>

           
            <div class="login-social">
                
                <a href="#">Facebook</a> | 
                <a href="#">Twitter</a> | 
                <a href="#">Google</a>
            </div>

           
            <div class="criar-conta">
                <a href="criar-conta.html">Criar uma conta</a>
            </div>

        </section>
    </main>

</body>
</html>
